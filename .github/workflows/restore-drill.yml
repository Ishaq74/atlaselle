name: Restore drill

# Exercice automatique sauvegarde → restauration (docs/operations/backup-restore-rollback.md).
# Une sauvegarde qu'on n'a jamais restaurée n'est pas une sauvegarde : ce job crée une base
# PostgreSQL 16 jetable (migrations + infra + seed), la sauvegarde avec `pnpm db:backup`,
# la restaure dans une base temporaire et compare les comptes de lignes et le journal des
# migrations. Il échoue si la restauration n'est pas strictement identique à la source.
# Aucune donnée réelle : le fichier de sauvegarde n'est jamais publié en artefact.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/database/commands/_backup.ts"
      - "src/database/commands/db.backup.ts"
      - "src/database/commands/db.restore-test.ts"
      - "src/database/commands/_erasure.ts"
      - "src/lib/erasure-ledger.ts"
      - "src/modules/travelers/domain/travelers-service.ts"
      - "tests/integration/erasure-restore-e2e.test.ts"
      - ".github/workflows/restore-drill.yml"

concurrency:
  group: restore-drill-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drill:
    name: Backup & restore drill
    # Épinglé : le client PostgreSQL 16 doit correspondre au serveur du service, et il n'est
    # plus empaqueté dans les dépôts par défaut d'ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: atlaselle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_ENV: LOCAL
      DATABASE_URL_LOCAL: postgresql://test:test@localhost:5432/atlaselle_test
      NODE_ENV: test
      BETTER_AUTH_SECRET: restore-drill-throwaway-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:4321
      SITE_URL: http://localhost:4321
      SMTP_PROVIDER: NODEMAILER
      SMTP_FROM_EMAIL: ci@test.local
      SMTP_HOST: localhost
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: PostgreSQL 16 client tools
        # Le client doit avoir la même version majeure que le serveur du service (16) :
        # un pg_dump plus récent produit des dumps qu'un serveur 16 refuse de restaurer.
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ] || [ ! -x /usr/lib/postgresql/16/bin/pg_restore ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client-16
          fi
          /usr/lib/postgresql/16/bin/pg_dump --version

      - name: Migrations, infra and seed
        run: |
          pnpm db:migrate
          pnpm db:infra
          pnpm db:seed

      - name: Backup then restore into a scratch database
        run: pnpm db:restore-test

      # Scénario complet avec le client 16 exact : sauvegarde → effacement RGPD → restauration → rejeu.
      # Ignoré ailleurs (client de version différente) : seul ce job le fait réellement tourner.
      - name: Erasure survives a restore (backup → erase → restore → replay)
        run: pnpm exec vitest run tests/integration/erasure-restore-e2e.test.ts
